name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p /root/.local/share/godot/export_templates/4.7.2.stable
          cp /root/.local/share/godot/templates/4.7.2.stable/web_* \
             /root/.local/share/godot/export_templates/4.7.2.stable/

      - name: Import project
        run: godot --headless --import --path . --quit-after 10 || true

      - name: Export Web
        run: |
          mkdir -p Build/Web
          godot --headless --path . --export-release Web Build/Web/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Build/Web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
